{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microshield-bpo-site.secretName" . }}
  namespace: {{ include "microshield-bpo-site.namespace" . }}
  labels:
    {{- include "microshield-bpo-site.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secret.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.secret.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
